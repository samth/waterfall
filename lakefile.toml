name = "waterfall"
version = "0.1.0"
description = "Small, configurable proof search for inductive Lean goals"
keywords = ["automation", "induction", "tactic", "software-verification"]
license = "Apache-2.0"
licenseFiles = ["LICENSE"]
readmeFile = "README.md"
homepage = "https://samth.github.io/waterfall/"
defaultTargets = ["waterfall"]
testDriver = "waterfallTests"

[[lean_lib]]
name = "waterfall"

[[lean_lib]]
name = "waterfallTests"
roots = ["Tests.DeferredSolvers", "Tests.IndexedDescent", "Tests.Focusing", "Tests.FocusingContinuation", "Tests.ContradictionBudget", "Tests.Continuations", "Tests.InductionCritics", "Tests.ArithmeticWitness", "Tests.Critics", "Tests.Core", "Tests.Canonical", "Tests.Observe", "Tests.ContextPolicy",
  "Tests.DefaultPolicy", "Tests.Exhaustion", "Tests.SearchPolicy", "Tests.Schedule",
  "Tests.TrialPolicy", "Tests.InductionPlan", "Tests.Options", "Tests.Import", "Tests.ModuleImport", "Tests.PublicAPI", "Tests.Capabilities",
  "Tests.Parallel", "Tests.ParallelAsync", "Tests.Regressions", "Tests.Suggestions", "Tests.Leaf", "Tests.ForeignTrace", "Tests.Coexistence", "Tutorial.Guide", "Tutorial.Examples"]
